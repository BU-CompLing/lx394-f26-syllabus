{% if page.math %}
<script>
  MathJax = {
    tex: {
      inlineMath: [['$', '$'], ['\\(', '\\)']],
      displayMath: [['$$', '$$'], ['\\[', '\\]']],
      processEscapes: true,
      tags: 'ams',
      tagSide: 'left'
    },
    chtml: {
      displayIndent: '0' // Aligns display math to the left margin (e.g., '0' or '1.5em')
    }
  };
</script>
<script 
  type="text/javascript" 
  id="MathJax-script" 
  async 
  src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js">
</script>
{% endif %}
